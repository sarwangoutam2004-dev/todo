<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST - Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div class="container mt-5">

    <h1 class="text-center mb-5">Django ToDo App</h1>

    <div class="row">

        <!-- Left Side -->
        <div class="col-md-8">

            <h2>My Day</h2>
            <p class="text-muted">{% now "jS F Y" %}</p>

            <!-- Task Card -->
            <div class="card mb-3">
                <div class="card-body d-flex justify-content-between align-items-center">

                    <span>This is some Task</span>

                    <div>

                        <button class="btn btn-success btn-sm">
                            <i class="bi bi-check-lg"></i> Mark as Done
                        </button>

                        <button class="btn btn-danger btn-sm">
                            <i class="bi bi-trash"></i>
                        </button>

                        <button class="btn btn-primary btn-sm">
                            <i class="bi bi-pencil"></i>
                        </button>

                    </div>

                </div>
            </div>

        </div>

        <!-- Right Side -->
        <div class="col-md-4">

            <h4>Completed Tasks</h4>

            <div class="card">
                <div class="card-body">
                    This is the completed task.
                </div>
            </div>

        </div>

    </div>

    <!-- Add Task -->
    <div class="row mt-5">

        <div class="col-md-10">
            <input type="text"
                   class="form-control form-control-lg"
                   placeholder="Enter New Task">
        </div>

        <div class="col-md-2">
            <button class="btn btn-info btn-lg w-100">
                Add
            </button>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
